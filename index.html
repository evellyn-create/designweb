<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Semana 11</title>
    <link href="https://cdn.jsdelivr.net/npm/daisyui@latest/dist/full.min.css" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
</head>
<body>
    <main class="flex flex-col justify-center items-center h-screen w-full "> 
        <div x-data="{ tags: ['CSS'], newTag: '' }"  >
            <!-- push serve p inserir um item na lista -->
            <input x-model="newTag" @keydown.enter="tags.push(newTag); newTag='' ">
            <!-- lista os itens em uma lista de dados composta por manipulação -->
            <template x-for="tag in tags"> 
                <span class="badge">
                    <span x-text="tag"></span>
                    <button @click=" tags = tags.filter(t => t !== tag)" class="btn btn-ghost">X</button>
                </span>
            </template>
        </div>

        <div x-data="{ tags: ['HTML'], novo: '' }" >
            <input x-model="novo" @keydown.enter="tags.push(novo); novo=''">
            
            <template x-for="tag in tags">
                <span class="badge">
                    <span x-text="tag"></span>
                    <button @click="tags = tags.filter(t => t !== tag)" class="btn btn-ghost text-xs">X</button>
                </span>
            </template>
        </div>
    </main>













</body>
</html>
