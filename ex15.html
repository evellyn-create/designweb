<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
       <link href="https://cdn.jsdelivr.net/npm/daisyui@latest/dist/full.min.css" rel="stylesheet">
     <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
</head>
<body>
    <div x-data="{liked: false, count: 0 }">
        <button class="btn"
                @click="
                if (!liked) {
                    liked = true;
                    count++;
                } else {
                    liked = false;
                    count--;
                } ">

            <span x-show="!liked">🤍</span>
            <span x-show="liked">❤️</span>
        </button>

  <span class="text-xl font-bold" x-text="count"></span>
  </div>
</body>
</html>
