<div x-data="{ open: false }">

  <!-- Fecha se apertar ESC -->
  <div @keydown.escape.window="open = false">
  
    <button @click="open = true">Abrir</button>

    <!-- Fecha se clicar fora -->
    <div x-show="open" 
         @click.outside="open = false">
       Sou um Modal!
    </div>
    
  </div>

</div>

    <div x-data="{ on: false }">
  <button @click="on = !on">Toggle</button>

  <div x-show="on"
       x-transition
       x-transition:enter.duration.500ms
       x-transition:leave.duration.200ms>
       
    Olha que suave!
    
  </div>
</div>
