<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js" defer></script>
    <link href="https://cdn.jsdelivr.net/npm/daisyui@4.12.10/dist/full.min.css" rel="stylesheet" />
</head>
<body>
    <div x-data="{ zoom: false}" class="flex justify-center items-center h-screen w-full">
        <img @mouseenter="zoom = true" @mouseleave="zoom = false" 
        :class="zoom ? 'scale-150' : 'scale-100' " src="img/ex20-natal.jpg" alt="" class="w-60 h-60 duration-300">
    </div>
    
</body>
</html>
